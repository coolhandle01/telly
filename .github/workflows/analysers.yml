name: analysers

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: oxlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  types:
    name: tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Its own check: vite strips types without checking them, so a type error
      # is not a build failure.
      - run: npm run typecheck
      - name: the node types match the pinned node
        run: |
          pinned=$(tr -d 'v \n' < .nvmrc | cut -d. -f1)
          types=$(node -p "require('./package.json').devDependencies['@types/node'].replace(/[^0-9.]/g,'').split('.')[0]")
          if [ "$pinned" != "$types" ]; then
            echo "::error::.nvmrc pins Node $pinned but @types/node is $types"
            exit 1
          fi

  bundle:
    name: vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vite build

  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Squash is the only merge method, so the title is the commit subject.
      - name: conventional pull request title
        env:
          # ${{ }} is pasted into the shell source. Via env it is data, not code.
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | npx commitlint
