# CodeQL advanced setup. The scan is version-controlled here rather than
# configured in repository settings — and, more to the point, it can be called
# by deploy.yml, so a publish physically cannot precede its CodeQL results.
#
# Default setup must be off (Settings → Code security → Code scanning) for this
# to run: the two cannot run together, and while default setup is enabled the
# analyze step below fails.
#
# Both languages use build-mode `none` — the extractor reads source directly.
# `actions` scans the workflows in this directory, which is the reason it is
# here at all: they run with a token, and a bad pattern in one of them is a
# supply-chain problem rather than a bug.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Weekly catch-all, so new CodeQL queries reach main in a quiet week too.
    # Off-the-hour minute per GitHub's scheduling guidance.
    - cron: "41 4 * * 2"
  # Callable so deploy.yml can gate the publish on a fresh scan of what it is
  # about to publish.
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # analyze uploads results
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
