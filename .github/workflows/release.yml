name: release

# Fires only on a version tag, which bumpversion.yml creates.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The same reusable workflows a pull request runs, not a copy of them. Left
  # unnamed so the checks keep the names they answer to on a pull request.
  checks:
    uses: ./.github/workflows/analysers.yml

  tests:
    uses: ./.github/workflows/tests.yml

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  build:
    name: build
    needs: [checks, tests, codeql]
    runs-on: ubuntu-latest
    # The client ID is inlined at build time and lives on this environment.
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_YOUTUBE_CLIENT_ID: ${{ vars.VITE_YOUTUBE_CLIENT_ID }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      # A second copy, for smoke to pull down.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  smoke:
    name: smoke test the bundle
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: serve it
        run: |
          python3 -m http.server 8000 --directory dist &
          for _ in $(seq 1 20); do curl -fsS http://localhost:8000/ >/dev/null 2>&1 && break; sleep 0.5; done
      - name: the set is there
        run: |
          title=$(curl -fsS http://localhost:8000/ | grep -o '<title>[^<]*</title>')
          echo "$title"
          case "$title" in *telly*) ;; *) echo "unexpected homepage"; exit 1 ;; esac
      # Wrong asset paths render a blank page and still return 200 for the
      # document, so the document alone proves nothing.
      - name: its bundle is reachable
        run: |
          asset=$(curl -fsS http://localhost:8000/ | grep -o 'src="[^"]*\.js"' | head -1 | sed 's/src="//;s/"//')
          [ -n "$asset" ] || { echo "no script referenced"; exit 1; }
          curl -fsS -o /dev/null "http://localhost:8000/${asset#./}"
      - name: the terms and the privacy policy are reachable
        run: |
          for page in privacy terms; do
            got=$(curl -fsS "http://localhost:8000/$page/index.html" | grep -o '<title>[^<]*</title>')
            case "$got" in *telly*) ;; *) echo "$page did not serve"; exit 1 ;; esac
          done

  publish:
    name: publish to GitHub Pages
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Last, so a release only exists once the thing it names is live.
  github-release:
    name: github release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
