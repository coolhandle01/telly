name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Callable so the deploy runs this exact suite before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage

  dst:
    name: british summer time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Its own check because its own failure means something specific. The
      # runner is UTC, where the clocks never change, so the ordinary suite
      # cannot see a British Summer Time bug — three were sitting there. These
      # run under TZ=Europe/London and are excluded from the ordinary run,
      # where they would fail for the wrong reason.
      - run: npm run test:dst
