<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>telly</title>
    <meta
      name="description"
      content="Your YouTube subscriptions, broadcast as a television channel with a 24-hour schedule. You don't pick what to watch — you switch it on and see what's on. When nothing is on, you get the test card."
    />
    <meta name="color-scheme" content="dark" />
    <!-- What may run here. frame-ancestors needs a header Pages cannot serve. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' https://accounts.google.com https://www.youtube.com https://s.ytimg.com;
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: https://*.ytimg.com https://*.ggpht.com https://*.googleusercontent.com;
               font-src 'self';
               connect-src 'self' https://www.googleapis.com https://accounts.google.com;
               frame-src https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com;
               base-uri 'none';
               object-src 'none';
               form-action 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
